name: Build APK Ruang Kelas

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Compile Kotlin + resources
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "Build gagal (exit $rc) - ringkasan error:"
              echo '```'
              grep -A10 -E "^e: |ERROR:|error:|FAILURE:|What went wrong" /tmp/build.log | head -160
              echo '```'
            } > /tmp/err.md
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/err.md)" || true
            tail -120 /tmp/build.log
            exit $rc
          fi
          echo "APK berhasil dibangun"
          tail -20 /tmp/build.log

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-0.15.4-debug.apk
          ls -lh dist

      - name: Publish APK ke Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.15.4-android"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Ruang Kelas 0.15.4 - Launcher: lampu mati saat siang, cahaya jendela (APK)" \
              --notes "APK debug siap dipasang di tablet Android. Unduh RuangKelas-0.15.4-debug.apk lalu buka di perangkat (izinkan instalasi dari sumber ini)."
          gh release upload "$TAG" dist/RuangKelas-0.15.4-debug.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit APK ke dist/
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ruang-kelas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dist/RuangKelas-0.15.4-debug.apk
          git rm -q --cached --ignore-unmatch dist/RuangKelas-0.15.1-debug.apk || true
          git commit -q -m "build(apk): RuangKelas-0.15.4-debug.apk dari CI [skip ci]" || echo "tidak ada perubahan"
          git pull --rebase -q origin "${GITHUB_REF}" || true
          git push -q origin "HEAD:${GITHUB_REF}" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuangKelas-debug-apk
          path: dist/RuangKelas-0.15.4-debug.apk
          if-no-files-found: error
          retention-days: 30
