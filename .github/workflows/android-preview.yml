name: Preview APK di Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - ".ci/preview.trigger"

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Jalankan APK di tablet emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Salin APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-0.15.2-debug.apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Info SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_SDK_ROOT || true

      - name: Siapkan SDK + system image
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"

      - name: Buat AVD tablet 2560x1600
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          set -x
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager --verbose create avd -n tab -k "system-images;android-33;google_apis;x86_64" -d pixel --force -p "$ANDROID_AVD_HOME/tab.avd"
          ls -la "$ANDROID_AVD_HOME"
          CFG="$ANDROID_AVD_HOME/tab.avd/config.ini"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d' "$CFG"
          printf 'hw.lcd.width=2560\nhw.lcd.height=1600\nhw.lcd.density=320\n' >> "$CFG"
          cat "$CFG"

      - name: Boot emulator + screenshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          set +e
          set -x
          REPORT=/tmp/emu.log
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee -a $REPORT) 2>&1

          emit() {
            {
              echo "Emulator report ($1):"
              echo '```'
              tail -n 60 $REPORT
              echo '```'
            } > /tmp/emu.md
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/emu.md)" || true
          }

          nohup emulator -avd tab -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          adb start-server

          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            kill -0 $EMU_PID 2>/dev/null || { echo "emulator mati"; break; }
            sleep 5
          done
          adb devices -l
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "--- emulator.log ---"; tail -80 /tmp/emulator.log
            emit "emulator tidak boot"
            exit 1
          fi

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          # emulator kadang lambat -> sembunyikan dialog ANR/crash supaya screenshot bersih
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put system screen_off_timeout 1800000 || true
          adb install -r dist/RuangKelas-0.15.2-debug.apk || { emit "install gagal"; exit 1; }
          # izinkan lokasi kasar sekalian (dialog izin tidak menutupi screenshot)
          adb shell pm grant dev.retrobit.ruangkelas android.permission.ACCESS_COARSE_LOCATION || true
          mkdir -p docs/screens

          # launcher hanya punya satu layar: tunggu gambar scene tampil penuh
          adb shell am force-stop dev.retrobit.ruangkelas
          adb shell am start -W -n dev.retrobit.ruangkelas/.MainActivity
          sleep 6
          adb shell screencap -p /sdcard/launcher.png
          adb pull /sdcard/launcher.png docs/screens/launcher.png || true
          adb logcat -d -s AndroidRuntime:E | tail -20


      - name: Aksi ketuk objek launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPORT=/tmp/aksi.log
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee -a $REPORT) 2>&1
          set -x
          python3 scripts/preview_actions.py
          {
            echo "Aksi launcher report:"
            echo '```'
            tail -n 80 $REPORT
            echo '```'
          } > /tmp/aksi.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/aksi.md)" || true

      - name: Commit screenshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPORT=/tmp/git.log
          exec > >(tee -a $REPORT) 2>&1
          set -x
          git config user.name "ruang-kelas-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase -q origin "refs/heads/${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; }
          git branch --show-current
          ls -la docs/screens || true
          git add -f docs/screens || true
          git status --short || true
          git commit -m "chore(preview): screenshot aplikasi dari emulator [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true
          git log --oneline -3 || true
          git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" || true

          {
            echo "Git report:"
            echo '```'
            tail -n 60 $REPORT
            echo '```'
          } > /tmp/git.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/git.md)" || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RuangKelas-screenshots
          path: docs/screens/*.png
          if-no-files-found: warn
