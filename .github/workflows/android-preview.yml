name: Preview APK di Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - "android/preview.trigger"

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Jalankan APK di tablet emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Salin APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-0.6.0-debug.apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Info SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_SDK_ROOT || true

      - name: Boot emulator + screenshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          set -x
          REPORT=/tmp/emu.log
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee -a $REPORT) 2>&1

          emit() {
            {
              echo "Emulator report ($1):"
              echo '```'
              tail -n 60 $REPORT
              echo '```'
            } > /tmp/emu.md
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/emu.md)" || true
          }

          IMG="system-images;android-33;google_apis;x86_64"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "$IMG" || { emit "sdkmanager gagal"; exit 1; }

          avdmanager list device | head -40
          echo no | avdmanager create avd -n tab -k "$IMG" --force || { emit "avdmanager gagal"; exit 1; }
          ls -la "$HOME/.android/avd" || true

          CFG="$HOME/.android/avd/tab.avd/config.ini"
          if [ -f "$CFG" ]; then
            sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d' "$CFG"
            printf 'hw.lcd.width=2560\nhw.lcd.height=1600\nhw.lcd.density=320\n' >> "$CFG"
            echo "--- config.ini ---"; cat "$CFG"
          else
            echo "config.ini tidak ada"; ls -la "$HOME/.android/avd" || true
          fi

          nohup emulator -avd tab -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics -no-boot-anim > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          adb start-server

          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            kill -0 $EMU_PID 2>/dev/null || { echo "emulator mati"; break; }
            sleep 5
          done
          adb devices -l
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "--- emulator.log ---"; tail -80 /tmp/emulator.log
            emit "emulator tidak boot"
            exit 1
          fi

          adb shell settings put global window_animation_scale 0 || true
          adb install -r dist/RuangKelas-0.6.0-debug.apk || { emit "install gagal"; exit 1; }
          mkdir -p docs/screens

          for SCREEN in HOME JURNAL CATATAN ABSENSI NILAI JADWAL KALENDER KALKULATOR BINDER KELAS PROFIL KIT; do
            LOWER=$(echo "$SCREEN" | tr '[A-Z]' '[a-z]')
            adb shell am force-stop dev.retrobit.ruangkelas
            adb logcat -c
            adb shell am start -W -n dev.retrobit.ruangkelas/.MainActivity --es screen "$SCREEN"
            sleep 5
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png "docs/screens/${LOWER}.png" || true
            adb logcat -d -s AndroidRuntime:E | tail -20
          done

          adb shell dumpsys activity activities | grep -i "mResumedActivity" || true
          ls -la docs/screens
          emit "selesai"
