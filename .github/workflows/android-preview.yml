name: Preview APK di Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - ".ci/preview.trigger"

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Jalankan APK di tablet emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Salin APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-0.6.0-debug.apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Info SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_SDK_ROOT || true

      - name: Siapkan SDK + system image
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"

      - name: Buat AVD tablet 2560x1600
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          set -x
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager --verbose create avd -n tab -k "system-images;android-33;google_apis;x86_64" -d pixel --force -p "$ANDROID_AVD_HOME/tab.avd"
          ls -la "$ANDROID_AVD_HOME"
          CFG="$ANDROID_AVD_HOME/tab.avd/config.ini"
          sed -i '/hw.lcd.width/d;/hw.lcd.height/d;/hw.lcd.density/d' "$CFG"
          printf 'hw.lcd.width=2560\nhw.lcd.height=1600\nhw.lcd.density=320\n' >> "$CFG"
          cat "$CFG"

      - name: Boot emulator + screenshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          set +e
          set -x
          REPORT=/tmp/emu.log
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee -a $REPORT) 2>&1

          emit() {
            {
              echo "Emulator report ($1):"
              echo '```'
              tail -n 60 $REPORT
              echo '```'
            } > /tmp/emu.md
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/emu.md)" || true
          }

          nohup emulator -avd tab -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          adb start-server

          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            kill -0 $EMU_PID 2>/dev/null || { echo "emulator mati"; break; }
            sleep 5
          done
          adb devices -l
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "--- emulator.log ---"; tail -80 /tmp/emulator.log
            emit "emulator tidak boot"
            exit 1
          fi

          adb shell settings put global window_animation_scale 0 || true
          adb install -r dist/RuangKelas-0.6.0-debug.apk || { emit "install gagal"; exit 1; }
          mkdir -p docs/screens

          for SCREEN in HOME JURNAL CATATAN ABSENSI NILAI JADWAL KALENDER KALKULATOR BINDER KELAS PROFIL KIT; do
            LOWER=$(echo "$SCREEN" | tr '[A-Z]' '[a-z]')
            adb shell am force-stop dev.retrobit.ruangkelas
            adb logcat -c
            adb shell am start -W -n dev.retrobit.ruangkelas/.MainActivity --es screen "$SCREEN"
            sleep 5
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png "docs/screens/${LOWER}.png" || true
            adb logcat -d -s AndroidRuntime:E | tail -20
          done

          adb shell dumpsys activity activities | grep -i "mResumedActivity" || true
          ls -la docs/screens
          emit "selesai"

      - name: Aksi interaktif (dialog, kalkulator, absensi)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPORT=/tmp/aksi.log
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          exec > >(tee -a $REPORT) 2>&1

          cat > /tmp/ui.py <<'PYEOF'
import re, subprocess, time, sys

def sh(cmd):
    return subprocess.run(cmd, shell=True, capture_output=True, text=True).stdout

NODE = re.compile(r'<node[^>]*>')

def nodes():
    sh("adb shell uiautomator dump /sdcard/ui.xml")
    sh("adb pull /sdcard/ui.xml /tmp/ui.xml")
    try:
        xml = open('/tmp/ui.xml').read()
    except FileNotFoundError:
        return []
    out = []
    for n in NODE.findall(xml):
        t = re.search(r'text="([^"]*)"', n)
        c = re.search(r'class="([^"]*)"', n)
        b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', n)
        if b:
            x1, y1, x2, y2 = map(int, b.groups())
            out.append({'text': (t.group(1) if t else '').strip(),
                        'class': (c.group(1) if c else ''),
                        'c': ((x1 + x2) // 2, (y1 + y2) // 2)})
    return out

def tap(x, y, wait=1.0):
    sh(f"adb shell input tap {x} {y}")
    time.sleep(wait)

def tap_text(label, nth=0):
    ns = nodes()
    hits = [n for n in ns if n['text'].lower() == label.lower()]
    if not hits:
        hits = [n for n in ns if label.lower() in n['text'].lower()]
    print('tap_text', label, 'hits', len(hits))
    if len(hits) <= nth:
        print('NOT FOUND', label, [n['text'] for n in ns if n['text']][:40])
        return False
    tap(*hits[nth]['c'])
    return True

def tap_cls(kind, nth=0):
    ns = [n for n in nodes() if kind in n['class']]
    print('tap_cls', kind, len(ns))
    if len(ns) <= nth:
        return False
    tap(*ns[nth]['c'])
    return True

def shot(name):
    sh(f"adb shell screencap -p /sdcard/{name}.png")
    print(sh(f"adb pull /sdcard/{name}.png docs/screens/{name}.png").strip())

def launch(screen):
    sh("adb shell am force-stop dev.retrobit.ruangkelas")
    sh("adb logcat -c")
    sh(f"adb shell am start -W -n dev.retrobit.ruangkelas/.MainActivity --es screen {screen}")
    time.sleep(4)

def crashes():
    out = sh("adb logcat -d -b crash")
    if out.strip():
        print('--- CRASH ---')
        print(out[-4000:])

# 1. Jurnal -> dialog -> isi materi -> simpan
launch('JURNAL')
tap_text('CATAT PERTEMUAN')
shot('aksi-dialog-jurnal')
tap_cls('EditText', 0)
sh('adb shell input text "Sistem%sPencernaan%sManusia"')
time.sleep(1)
shot('aksi-form-jurnal')
tap_text('SIMPAN', 0)
time.sleep(1.5)
shot('aksi-jurnal-baru')
crashes()

# 2. Kalkulator: 78 + 85 x 2
launch('KALKULATOR')
for key in ['7', '8', '+', '8', '5', '×', '2']:
    ok = tap_text(key)
    print('key', key, ok)
shot('aksi-kalkulator')
crashes()

# 3. Absensi: tandai S lalu I
launch('ABSENSI')
tap_text('S', 0)
tap_text('S', 1)
shot('aksi-absensi')
crashes()
PYEOF
          python3 /tmp/ui.py

          {
            echo "Aksi interaktif report:"
            echo '```'
            tail -n 60 $REPORT
            echo '```'
          } > /tmp/aksi.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/aksi.md)" || true

      - name: Simpan APK ke repo
        if: always()
        run: |
          set +e
          git config user.name "ruang-kelas-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-debug.apk
          git add -f dist/RuangKelas-debug.apk
          git commit -m "build(apk): RuangKelas-debug.apk dari CI [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Commit screenshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPORT=/tmp/git.log
          exec > >(tee -a $REPORT) 2>&1
          set -x
          git config user.name "ruang-kelas-bot"
          git config user.email "bot@users.noreply.github.com"
          git branch --show-current
          ls -la docs/screens || true
          git add -f docs/screens || true
          git status --short || true
          git commit -m "chore(preview): screenshot aplikasi dari emulator [skip ci]" || true
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || true
          git log --oneline -3 || true
          git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" || true

          {
            echo "Git report:"
            echo '```'
            tail -n 60 $REPORT
            echo '```'
          } > /tmp/git.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(head -c 60000 /tmp/git.md)" || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RuangKelas-screenshots
          path: docs/screens/*.png
          if-no-files-found: warn
