name: Preview APK di Emulator

on:
  workflow_dispatch:

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Jalankan APK di tablet emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Salin APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/RuangKelas-0.6.0-debug.apk

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -x
            adb install -r dist/RuangKelas-0.6.0-debug.apk
            mkdir -p docs/screens
            for SCREEN in HOME JURNAL CATATAN ABSENSI NILAI JADWAL KALENDER KALKULATOR BINDER KELAS PROFIL KIT; do
              adb shell am force-stop dev.retrobit.ruangkelas
              adb shell am start -W -n dev.retrobit.ruangkelas/.MainActivity --es screen "$SCREEN"
              sleep 6
              adb shell screencap -p /sdcard/shot.png
              adb pull /sdcard/shot.png "docs/screens/${SCREEN,,}.png"
            done
            adb shell dumpsys activity activities | grep -i "mResumedActivity" || true
            adb logcat -d -s AndroidRuntime:E | tail -40 || true

      - name: Commit screenshot
        if: always()
        run: |
          git config user.name "ruang-kelas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/screens || true
          git commit -m "chore(preview): screenshot aplikasi dari emulator [skip ci]" || exit 0
          git push || true
