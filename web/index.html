<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15142A">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Ruang Kelas</title>
<style>
  :root{
    --ink:#0E0D1A; --night:#15142A; --cream:#F8E9C8; --cream2:#E3CDA6;
    --amber:#F2AB3F; --screen:#D7F7CD;
    --ratio: 1312 / 816;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
  body{touch-action:manipulation;user-select:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* letterbox: gambar selalu 1312:816, sisa layar hitam — sama seperti APK */
  #stage{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    aspect-ratio:var(--ratio);
    width:min(100vw, calc(100vh * var(--ratio)));
    max-height:100vh;
  }
  /* ukuran stage dipastikan lewat JS (fit()) — CSS di atas hanya fallback */
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #fx text{font-family:"Silkscreen","Courier New",monospace;font-weight:700;dominant-baseline:auto}

  .hotspot{position:absolute;border:0;padding:0;margin:0;background:transparent;
    cursor:pointer;outline:none;border-radius:0}
  .hotspot.is-pressed{background:rgba(242,171,63,.20);box-shadow:0 0 0 3px var(--amber) inset}

  #tint{position:absolute;inset:0;pointer-events:none}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px)}

  #toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,8px);
    padding:8px 14px;background:var(--night);border:2px solid var(--amber);
    color:var(--cream2);font-size:12px;letter-spacing:1px;white-space:nowrap;
    opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #rotate{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:var(--ink);color:var(--cream2);
    font-size:12px;letter-spacing:2px;text-align:center;padding:24px;z-index:10}
  #rotate .icon{width:56px;height:56px;border:3px solid var(--amber);border-radius:8px;position:relative}
  #rotate .icon::after{content:"";position:absolute;inset:8px 16px;border:3px solid var(--amber);border-radius:4px}
  #rotate small{color:#7D75A0;letter-spacing:1px;font-size:11px;line-height:1.7}
  /* di preview, layar potret cukup dilayerbox — sama seperti APK di layar lain rasio */
</style>
</head>
<body>
<div id="stage">
  <img id="scene" src="scene_night.png" alt="Workspace guru" draggable="false">
  <svg id="fx" viewBox="0 0 1312 816" preserveAspectRatio="none">
    <!-- angin: gorden & daun -->
    
    <g clip-path="url(#c0)">
      <image class="sway-scene" href="scene_night.png" x="0" y="0" width="1312" height="816">
        <animateTransform attributeName="transform" type="translate"
          values="-2.2,0; 2.2,0; -2.2,0" dur="5.2s"
          begin="0.0s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </image>
    </g>
    <clipPath id="c0"><rect x="995" y="78" width="40" height="308"/></clipPath>

    <g clip-path="url(#c1)">
      <image class="sway-scene" href="scene_night.png" x="0" y="0" width="1312" height="816">
        <animateTransform attributeName="transform" type="translate"
          values="-2.2,0; 2.2,0; -2.2,0" dur="5.2s"
          begin="0.9s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </image>
    </g>
    <clipPath id="c1"><rect x="1216" y="224" width="34" height="246"/></clipPath>

    <g clip-path="url(#c2)">
      <image class="sway-scene" href="scene_night.png" x="0" y="0" width="1312" height="816">
        <animateTransform attributeName="transform" type="translate"
          values="-2.2,0; 2.2,0; -2.2,0" dur="5.2s"
          begin="1.8s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </image>
    </g>
    <clipPath id="c2"><rect x="1088" y="470" width="170" height="200"/></clipPath>

    <!-- rel gorden = indikator baterai -->
    <line id="rail" x1="1006" y1="57" x2="1288" y2="198"
          stroke="#77B8D9" stroke-width="3.4" stroke-linecap="round"/>
    <g id="rail-ticks" stroke="#0E0D1A" stroke-width="1.2"></g>

    <!-- persentase baterai di dinding di atas rel -->
    <g id="batt-g" transform="matrix(108.000,26.000,0.000,44.000,1014.000,0.000)">
      <text id="batt" x="55.54" y="37.84" text-anchor="middle"
            fill="#E3CDA6" font-size="25.52">100%</text>
    </g>

    <!-- lima bingkai aplikasi -->
    <g id="icons">
    <polygon points="77.0,241.0 107.0,226.0 107.0,278.0 77.0,293.0" fill="#1FBF5B"/>
    <polygon points="83.0,247.4 101.0,238.4 101.0,261.2 90.8,266.3 86.0,278.1 86.3,268.6 83.0,270.2" fill="#FFFFFF"/>
    <polygon points="151.0,202.0 181.0,187.0 181.0,239.0 151.0,254.0" fill="#E03A3A"/>
    <polygon points="157.6,210.1 163.0,207.4 166.0,226.7 169.0,204.4 174.4,201.7 168.4,234.9 163.6,237.3" fill="#FFFFFF"/>
    <polygon points="225.0,164.0 255.0,149.0 255.0,201.0 225.0,216.0" fill="#1DB954"/>
    <polygon points="231.0,176.6 249.0,169.7 249.0,174.9 231.0,181.8" fill="#FFFFFF"/>
    <polygon points="231.6,185.7 248.4,179.3 248.4,183.5 231.6,189.8" fill="#FFFFFF"/>
    <polygon points="232.2,193.7 247.8,188.0 247.8,191.1 232.2,196.8" fill="#FFFFFF"/>
    <polygon points="299.0,124.0 329.0,110.0 329.0,163.0 299.0,177.0" fill="#D63B32"/>
    <polygon points="306.2,132.3 306.2,162.0 323.0,139.3" fill="#FFFFFF"/>
    <polygon points="374.0,86.0 404.0,72.0 403.0,125.0 373.0,139.0" fill="#1E2C63"/>
    <polygon points="388.8,87.5 397.7,89.6 397.5,103.4 388.2,122.5 379.5,111.8 379.7,98.0" fill="#FFFFFF"/>
    <polygon points="388.7,94.9 393.4,96.9 393.3,104.3 388.3,114.0 383.7,108.8 383.8,101.4" fill="#1E2C63"/>
    </g>

    <!-- judul papan tulis -->
    <g id="board" transform="matrix(230.000,-118.000,0.000,192.000,344.000,250.000)">
      <text id="board-title" x="129.25" y="30.72" text-anchor="middle"
            fill="#181430" font-size="22.08" letter-spacing="1">JADWAL MENGAJAR</text>
      <line x1="46.53" y1="41.28" x2="211.97" y2="41.28"
            stroke="rgba(24,20,48,.35)" stroke-width="1.6"/>
    </g>

    <!-- kalender: halaman bisa terlipat -->
    <g id="cal" transform="matrix(43.000,20.000,-13.000,46.000,1043.000,405.000)">
      <rect id="cal-pad" x="0" y="2.87" width="47.42" height="54.02" fill="#CBB68C"/>
      <rect x="0" y="0" width="47.42" height="47.80" fill="#F3E7C8"/>
      <g id="cal-page" style="transform:scaleY(1);transform-origin:50% 0%;transition:transform .26s linear">
        <text id="cal-m" x="23.71" y="14.34" text-anchor="middle" fill="#181430" font-size="10.52">OKT</text>
        <text id="cal-d" x="23.71" y="35.37" text-anchor="middle" fill="#181430" font-size="21.99">27</text>
        <text id="cal-w" x="23.71" y="47.32" text-anchor="middle" fill="#181430" font-size="10.52">SEL</text>
      </g>
    </g>
  </svg>
  <div id="tint"></div>
  <div id="scan"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<div id="rotate">
  <div class="icon"></div>
  <div>PUTAR PERANGKAT KE LANDSCAPE</div>
  <small>Launcher ini hanya berjalan mendatar,<br>sama seperti di tablet.</small>
</div>

<script>
const SCENE = {w: 1312, h: 816};
const TILES = [
  {label: "Jurnal", x: 756, y: 314, w: 196, h: 126},
  {label: "Nilai", x: 686, y: 306, w: 112, h: 92},
  {label: "Kalkulator", x: 905, y: 436, w: 74, h: 52},
  {label: "Alat Tulis", x: 980, y: 372, w: 50, h: 66},
  {label: "Kalender", x: 1022, y: 392, w: 80, h: 90},
  {label: "Binder", x: 688, y: 536, w: 158, h: 158},
  {label: "Absensi", x: 334, y: 124, w: 252, h: 330},
  {label: "Catatan", x: 70, y: 265, w: 168, h: 190},
  {label: "Jadwal", x: 352, y: 248, w: 214, h: 192},
  {label: "Profil", x: 712, y: 36, w: 76, h: 124},
  {label: "Binder", x: 60, y: 425, w: 255, h: 310},
  {label: "Kelas", x: 1024, y: 95, w: 230, h: 300},
  {label: "File", x: 12, y: 646, w: 92, h: 122},
  {label: "WhatsApp", x: 70, y: 218, w: 48, h: 82},
  {label: "Vivaldi", x: 144, y: 179, w: 48, h: 82},
  {label: "Spotify", x: 218, y: 141, w: 48, h: 82},
  {label: "YouTube", x: 292, y: 102, w: 48, h: 82},
  {label: "Sinaga Jateng", x: 366, y: 63, w: 48, h: 83},
];
const RAIL = [1006,57,1288,198];

const stage = document.getElementById("stage");
const sceneEl = document.getElementById("scene");
const toast = document.getElementById("toast");
const railEl = document.getElementById("rail");
const railTicks = document.getElementById("rail-ticks");
const battEl = document.getElementById("batt");
const tintEl = document.getElementById("tint");
const calPage = document.getElementById("cal-page");
let toastTimer = 0;
let batteryLevel = 100;

function pct(v, total) { return (v / total * 100).toFixed(4) + "%"; }

function place(el, x, y, w, h) {
  el.style.left = pct(x, SCENE.w);
  el.style.top = pct(y, SCENE.h);
  el.style.width = pct(w, SCENE.w);
  el.style.height = pct(h, SCENE.h);
}

function showToast(name) {
  toast.textContent = name.toUpperCase();
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

function open(name) {
  showToast("MEMBUKA " + name);
}

TILES.forEach((tile) => {
  const el = document.createElement("button");
  el.className = "hotspot";
  el.type = "button";
  el.dataset.label = tile.label;
  el.setAttribute("aria-label", tile.label);
  place(el, tile.x, tile.y, tile.w, tile.h);
  el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
    el.addEventListener(ev, () => el.classList.remove("is-pressed")));
  el.addEventListener("click", (e) => { e.stopPropagation(); open(tile.label); });
  stage.appendChild(el);
});

// ---------------- rel gorden: tanda tiap 10% ----------------
(function buildTicks() {
  const ns = "http://www.w3.org/2000/svg";
  for (let i = 1; i <= 9; i++) {
    const t = i / 10;
    const x = RAIL[0] + (RAIL[2] - RAIL[0]) * t;
    const y = RAIL[1] + (RAIL[3] - RAIL[1]) * t;
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", x); line.setAttribute("y1", y - 5);
    line.setAttribute("x2", x); line.setAttribute("y2", y + 5);
    line.dataset.index = i;
    railTicks.appendChild(line);
  }
})();

const BULAN = ["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"];
const HARI = ["SEN","SEL","RAB","KAM","JUM","SAB","MIN"];

function ambience(h) {
  if (h >= 5 && h <= 8) return "rgba(255,217,160,.10)";
  if (h >= 9 && h <= 15) return "rgba(255,246,226,.16)";
  if (h >= 16 && h <= 18) return "rgba(255,154,92,.12)";
  if (h >= 19 && h <= 22) return "rgba(43,63,143,.14)";
  return "rgba(6,10,34,.34)";
}

function paintRail(day) {
  const colour = batteryLevel <= 15 ? "#D9483B" : batteryLevel <= 40 ? "#E0A03A"
    : day ? "#9FD8B0" : "#77B8D9";
  railEl.setAttribute("stroke", colour);
  [...railTicks.children].forEach((line) => {
    const i = +line.dataset.index;
    line.setAttribute("stroke", batteryLevel >= i * 10 ? "#0E0D1A" : "rgba(255,255,255,.4)");
  });
  battEl.textContent = batteryLevel + "%";
  battEl.setAttribute("fill", batteryLevel <= 15 ? "#EF6A5B" : "#E3CDA6");
}

let lastDay = null;

function tick() {
  const now = new Date();
  const day = now.getHours() >= 6 && now.getHours() <= 17;

  if (day !== lastDay) {
    const file = day ? "scene_day.png" : "scene_night.png";
    sceneEl.src = file;
    document.querySelectorAll(".sway-scene").forEach((img) => img.setAttribute("href", file));
    lastDay = day;
  }

  // kalender: kalau tanggal berganti, halaman dilipat dulu
  const shown = document.getElementById("cal-d").textContent;
  if (shown !== String(now.getDate())) {
    calPage.style.transform = "scaleY(0)";
    setTimeout(() => {
      document.getElementById("cal-m").textContent = BULAN[now.getMonth()];
      document.getElementById("cal-d").textContent = now.getDate();
      document.getElementById("cal-w").textContent = HARI[(now.getDay() + 6) % 7];
      calPage.style.transform = "scaleY(1)";
    }, 280);
  }

  tintEl.style.background = ambience(now.getHours());
  paintRail(day);
}

tick();
setInterval(tick, 1000);

// baterai: di browser memakai Battery Status API (kalau tersedia)
if (navigator.getBattery) {
  navigator.getBattery().then((b) => {
    const sync = () => {
      batteryLevel = Math.round(b.level * 100);
      paintRail(lastDay);
    };
    sync();
    b.addEventListener("levelchange", sync);
  }).catch(() => {});
}

// pastikan stage selalu 1312:816 muat penuh di viewport apa pun
// (CSS min()/calc() gagal di sebagian webview — ukuran dihitung JS di sini)
function fit() {
  var st = document.getElementById("stage");
  var s = Math.min(window.innerWidth / 1312, window.innerHeight / 816);
  st.style.width = Math.floor(1312 * s) + "px";
  st.style.height = Math.floor(816 * s) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
fit();

// minta browser mengunci landscape saat layar disentuh
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } catch (_) {}
}
document.addEventListener("pointerdown", lockLandscape, { once: true });
</script>
</body>
</html>
