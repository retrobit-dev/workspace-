<!DOCTYPE html>

<head>
<meta charset="utf-8">

<meta name="theme-color" content="#15142A">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Ruang Kelas</title>
<style>
  :root{
    --ink:#0E0D1A; --night:#15142A; --cream:#F8E9C8; --cream2:#E3CDA6;
    --amber:#F2AB3F; --screen:#D7F7CD;
    --ratio: 1280 / 800;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
  body{touch-action:manipulation;user-select:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* letterbox: gambar selalu 1280:800, sisa layar hitam — sama seperti APK */
  #stage{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    aspect-ratio:var(--ratio);
    width:min(100vw, calc(100vh * var(--ratio)));
    max-height:100vh;
  }
  /* ukuran stage dipastikan lewat JS (fit()) — CSS di atas hanya fallback */
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;
    pointer-events:none}
  #fx,#sky-under{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lap{position:absolute;pointer-events:none;display:none;image-rendering:auto}
  #drawer{position:absolute;inset:0;display:none;background:var(--ink);padding:18px 22px;z-index:5}
  #drawer-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  #drawer-head b{color:var(--amber);font-size:13px;letter-spacing:2px}
  #drawer-back{cursor:pointer;border:2px solid var(--amber);background:var(--night);
    color:var(--cream2);font:inherit;font-size:11px;padding:6px 12px;letter-spacing:1px}
  #drawer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ditem{border:2px solid var(--night);background:var(--night);color:var(--cream2);
    padding:14px 8px;font:inherit;font-size:11px;letter-spacing:1px;text-align:center;cursor:pointer}
  .ditem.aktif{border-color:#403F6C;color:var(--cream)}
  .ditem.aktif:hover{border-color:var(--amber);color:var(--amber)}
  .ditem small{display:block;margin-top:4px;color:#7D75A0;font-size:9px}
  #fx text{font-family:"Silkscreen","Courier New",monospace;font-weight:700;dominant-baseline:auto}

  .tap-flash{position:absolute;inset:0;background:rgba(242,171,63,.22);opacity:0;
    pointer-events:none;transition:opacity .12s ease}
  .tap-flash.show{opacity:1}

  #tint{position:absolute;inset:0;pointer-events:none}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px)}

  #toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,8px);
    padding:8px 14px;background:var(--night);border:2px solid var(--amber);
    color:var(--cream2);font-size:12px;letter-spacing:1px;white-space:nowrap;
    opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #rotate{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:var(--ink);color:var(--cream2);
    font-size:12px;letter-spacing:2px;text-align:center;padding:24px;z-index:10}
  #rotate .icon{width:56px;height:56px;border:3px solid var(--amber);border-radius:8px;position:relative}
  #rotate .icon::after{content:"";position:absolute;inset:8px 16px;border:3px solid var(--amber);border-radius:4px}
  #rotate small{color:#7D75A0;letter-spacing:1px;font-size:11px;line-height:1.7}
  /* di preview, layar potret cukup dilayerbox — sama seperti APK di layar lain rasio */
</style>
</head>

/* ---- area ketuk = poligon bentuk objek (0.16.35) ----
   Satu hit-test global pada stage (sama dengan APK): depan->belakang,
   bentuk area ketuk = bentuk objek; highlight tekan berbentuk poligon. */
function inPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
    const xi = poly[i], yi = poly[i + 1], xj = poly[j], yj = poly[j + 1];
    if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function tileAt(px, py) {
  for (let i = TILES.length - 1; i >= 0; i--) {
    const t = TILES[i];
    if (inPoly(px, py, t.poly) || (t.poly2 && inPoly(px, py, t.poly2))) return t;
  }
  return null;
}

const SKY_STOPS = [[0, "#0A0F2E", "#18224E"], [300, "#2E3A6E", "#F2955F"], [420, "#7FB2E8", "#CFE6F7"], [720, "#4D8FE0", "#A8CDF0"], [990, "#6D9BD8", "#F7C873"], [1080, "#3A3F7A", "#E86A5A"], [1170, "#232D5B", "#3A4C74"], [1440, "#1B2448", "#303F66"]];

function skyHex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function skyMix(a,b,t){
  const A=skyHex2rgb(a),B=skyHex2rgb(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function skyColors(m){
  m=((m%1440)+1440)%1440;
  for(let i=0;i<SKY_STOPS.length-1;i++){
    const a=SKY_STOPS[i],b=SKY_STOPS[i+1];
    if(m>=a[0]&&m<=b[0]){
      const t=(m-a[0])/Math.max(1,b[0]-a[0]);
      return [skyMix(a[1],b[1],t),skyMix(a[2],b[2],t)];
    }
  }
  return [SKY_STOPS[0][1],SKY_STOPS[0][2]];
}
function skyVisuals(code){
  if(code===0) return {langit:0,hujan:0};
  if(code===1) return {langit:1,hujan:0};
  if(code===2) return {langit:2,hujan:0};
  if(code===3) return {langit:3,hujan:0};
  if(code===45||code===48) return {langit:3,hujan:0,kabut:true};
  if(code>=51&&code<=57) return {langit:2,hujan:1};
  if(code===65||code===82) return {langit:2,hujan:3};
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return {langit:2,hujan:2};
  if((code>=71&&code<=77)||code===85||code===86) return {langit:2,hujan:0,salju:true};
  if(code===95||code===96||code===99) return {langit:3,hujan:3,petir:true};
  return {langit:2,hujan:0};
}
function setDisp(id,on){const el=document.getElementById(id);if(el)el.style.display=on?"":"none";}
function applySkyVis(isDay){

  }
  setDisp("sky-snow",!!w.salju);
  setDisp("sky-fog",!!w.kabut);

  setDisp("sky-roomray",isDay&&w.langit===0);

}
let SKY_LAST_DAY=null;
function skyTick(){
  const now=new Date();

}
function applySkyCode(code){
  if(typeof code!=="number")return;

}
async function skyLoadWeather(){

/* ---- angin nyata: tirai kanan & daun (amplitudo+kecepatan dari wind_speed) ---- */
const WIND_AMP = [1.1, 2.1, 3.4], WIND_PH = [0, 0.9, 1.8];
function windK() {
  const v = (SKY_WEATHER.angin === undefined) ? 8 : SKY_WEATHER.angin;
  return 0.25 + 0.75 * Math.min(1, Math.max(0, (v - 2) / 23));
}
function windTick() {
  const t = performance.now() / 1000;
  const k = windK();
  const gust = 0.72 + 0.28 * Math.sin(t * 0.7854 + 1.3) * Math.sin(t * 1.8326);
  const w = 2 * Math.PI / (4.6 - 3.2 * ((k - 0.25) / 0.75));
  const A = k * gust;
  for (let i = 1; i <= 3; i++) {
    const dx = (WIND_AMP[i - 1] * A * Math.sin(w * t - WIND_PH[i - 1])).toFixed(2);
    const tr = "translate(" + dx + ",0)";
    const dd = document.getElementById("cb-d" + i);
    const nn = document.getElementById("cb-n" + i);
    if (dd) dd.setAttribute("transform", tr);
    if (nn) nn.setAttribute("transform", tr);
  }
  const lg = document.getElementById("leaf-g");
  if (lg) {
    const dxl = (2.6 * A * Math.sin(2 * w * t - 0.5)).toFixed(2);
    const dyl = (0.9 * A * Math.sin(3 * w * t)).toFixed(2);
    lg.setAttribute("transform", "translate(" + dxl + "," + dyl + ")");
  }
  requestAnimationFrame(windTick);
}
requestAnimationFrame(windTick);

/* ---- bayangan matahari (waktu & lokasi perangkat, awan Open-Meteo) ---- */
const BAYANGAN_OBJ = [
  [766,484,40],[858,442,62],[924,479,34],[944,455,30],
  [805,332,40],[1157,690,55],[872,605,72],[55,750,42]
];
function matahari(lat,lon,t){
  const R=Math.PI/180, d=t/86400000-10957.5, n=(x)=>((x%360)+360)%360;
  const g=n(357.529+0.98560028*d), q=n(280.459+0.98564736*d);
  const L=n(q+1.915*Math.sin(g*R)+0.020*Math.sin(2*g*R));
  const e=23.439-0.00000036*d;
  const dec=Math.asin(Math.sin(e*R)*Math.sin(L*R))/R;
  const ra=Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15;
  const lmst=((18.697374558+24.06570982441908*d+lon/15)%24+24)%24;
  const H=(lmst-ra)*15*R, phi=lat*R;
  const se=Math.sin(phi)*Math.sin(dec*R)+Math.cos(phi)*Math.cos(dec*R)*Math.cos(H);
  const elev=Math.asin(se)/R;
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec*R)*Math.cos(phi))/R+180;
  return [n(az),elev];
}
function locPerangkat(){
  try{const v=JSON.parse(localStorage.getItem("rk-loc")||"null");if(v&&isFinite(v.lat))return v;}catch(e){}
  return {lat:-8.1728,lon:113.6995};
}
try{
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition((p)=>{
      try{localStorage.setItem("rk-loc",JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude}));}catch(e){}
    },()=>{},{timeout:8000,maximumAge:600000});
  }
}catch(e){}
function bayangTick(){
  const g=document.getElementById("bayangan");
  if(g){
    const now=new Date();
    const isDay=now.getHours()>=6&&now.getHours()<=17;
    const [az,elev]=matahari(locPerangkat().lat,locPerangkat().lon,now.getTime());
    if(!isDay||elev<=3){g.style.display="none";}
    else{
      g.style.display="";
      const tanE=Math.max(Math.tan(Math.max(elev,3)*Math.PI/180),0.28);
      const Ls=Math.min(2.8,Math.max(0.55,1.35/tanE));
      /* kompas isometrik (kesepakatan user): kiri-atas=barat, kanan-atas=utara,
         kanan-bawah=timur, kiri-bawah=selatan; bayangan mengarah (az+180) */
      const sA=(az+180)*Math.PI/180;
      const vx=0.894*(Math.cos(sA)+Math.sin(sA)), vy=0.447*(Math.sin(sA)-Math.cos(sA));
      const angD=Math.atan2(vy,vx)*180/Math.PI;
      const awan=(SKY_WEATHER.awan===undefined)?80:SKY_WEATHER.awan;
      let P=Math.pow(Math.max(0,1-awan/100),0.75);
      const c=SKY_WEATHER.code;
      if(c===45||c===48)P*=0.5; else if(c>=51)P*=0.75;
      const al=(0.04+0.26*P)*Math.min(1,Math.max(0.3,Math.sin(elev*Math.PI/180)*1.5));
      [...g.children].forEach((el,i)=>{
        const o=BAYANGAN_OBJ[i];if(!o)return;
        const cx=o[0],cy=o[1],r=o[2];
        el.setAttribute("transform","translate("+cx+","+cy+") rotate("+angD.toFixed(1)+")");
        el.setAttribute("cx",(r*0.85*Ls).toFixed(1));
        el.setAttribute("rx",(r*(0.75+0.85*Ls)).toFixed(1));
        el.setAttribute("ry",(r*0.5).toFixed(1));
        el.style.opacity=al.toFixed(3);
      });
    }
  }
  requestAnimationFrame(bayangTick);
}
requestAnimationFrame(bayangTick);


function ambience(h) {
  if (h >= 5 && h <= 8) return "rgba(255,217,160,.10)";
  if (h >= 9 && h <= 15) return "rgba(58,70,112,.14)";  // siang lembut, meredam silau (0.16.10)
  if (h >= 16 && h <= 18) return "rgba(255,154,92,.12)";
  if (h >= 19 && h <= 22) return "rgba(43,63,143,.14)";
  return "rgba(6,10,34,.34)";
}

let lastDay = null;

function tick() {
  const now = new Date();
  const day = now.getHours() >= 6 && now.getHours() <= 17;

  if (day !== lastDay) {
    const file = (day ? "scene_day.png" : "scene_night.png") + "?v=" + RKV;
    sceneEl.src = file;
    const mode = day ? "day" : "night";
    document.querySelectorAll(".lap").forEach((img) => {
      img.src = img.dataset[mode] + "?v=" + RKV;
    });
    document.querySelectorAll(".sway-scene").forEach((img) => img.setAttribute("href", file));
    document.querySelectorAll(".cur-day").forEach((el) => { el.style.display = day ? "" : "none"; });
    document.querySelectorAll(".cur-night").forEach((el) => { el.style.display = day ? "none" : ""; });
    lastDay = day;
  }

  tintEl.style.background = ambience(now.getHours());
}

tick();
setInterval(tick, 1000);

// pastikan stage selalu 1280:800 muat penuh di viewport apa pun
// (CSS min()/calc() gagal di sebagian webview — ukuran dihitung JS di sini)
function fit() {
  var st = document.getElementById("stage");
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  st.style.width = Math.floor(1280 * s) + "px";
  st.style.height = Math.floor(800 * s) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
fit();

// minta browser mengunci landscape saat layar disentuh
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } catch (_) {}
}
document.addEventListener("pointerdown", lockLandscape, { once: true });
</script>
