<!DOCTYPE html>

<title>Ruang Kelas</title>
<style>
  :root{
    --ink:#0E0D1A; --night:#15142A; --cream:#F8E9C8; --cream2:#E3CDA6;
    --amber:#F2AB3F; --screen:#D7F7CD;
    --ratio: 1280 / 800;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
  body{touch-action:manipulation;user-select:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* letterbox: gambar selalu 1280:800, sisa layar hitam — sama seperti APK */
  #stage{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    aspect-ratio:var(--ratio);
    width:min(100vw, calc(100vh * var(--ratio)));
    max-height:100vh;
  }
  /* ukuran stage dipastikan lewat JS (fit()) — CSS di atas hanya fallback */
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;
    pointer-events:none}
  #fx,#sky-under{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lap{position:absolute;pointer-events:none;display:none;image-rendering:auto}
  #drawer{position:absolute;inset:0;display:none;background:var(--ink);padding:18px 22px;z-index:5}
  #drawer-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  #drawer-head b{color:var(--amber);font-size:13px;letter-spacing:2px}
  #drawer-back{cursor:pointer;border:2px solid var(--amber);background:var(--night);
    color:var(--cream2);font:inherit;font-size:11px;padding:6px 12px;letter-spacing:1px}
  #drawer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ditem{border:2px solid var(--night);background:var(--night);color:var(--cream2);
    padding:14px 8px;font:inherit;font-size:11px;letter-spacing:1px;text-align:center;cursor:pointer}
  .ditem.aktif{border-color:#403F6C;color:var(--cream)}
  .ditem.aktif:hover{border-color:var(--amber);color:var(--amber)}
  .ditem small{display:block;margin-top:4px;color:#7D75A0;font-size:9px}
  #fx text{font-family:"Silkscreen","Courier New",monospace;font-weight:700;dominant-baseline:auto}

  .hotspot{position:absolute;border:0;padding:0;margin:0;background:transparent;
    cursor:pointer;outline:none;border-radius:0}
  .hotspot.is-pressed{background:rgba(242,171,63,.20);box-shadow:0 0 0 3px var(--amber) inset}

  #tint{position:absolute;inset:0;pointer-events:none}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px)}

  #toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,8px);
    padding:8px 14px;background:var(--night);border:2px solid var(--amber);
    color:var(--cream2);font-size:12px;letter-spacing:1px;white-space:nowrap;
    opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #rotate{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:var(--ink);color:var(--cream2);
    font-size:12px;letter-spacing:2px;text-align:center;padding:24px;z-index:10}
  #rotate .icon{width:56px;height:56px;border:3px solid var(--amber);border-radius:8px;position:relative}
  #rotate .icon::after{content:"";position:absolute;inset:8px 16px;border:3px solid var(--amber);border-radius:4px}
  #rotate small{color:#7D75A0;letter-spacing:1px;font-size:11px;line-height:1.7}
  /* di preview, layar potret cukup dilayerbox — sama seperti APK di layar lain rasio */
</style>
</head>

const tintEl = document.getElementById("tint");
let toastTimer = 0;
function pct(v, total) { return (v / total * 100).toFixed(4) + "%"; }

function place(el, x, y, w, h) {
  el.style.left = pct(x, SCENE.w);
  el.style.top = pct(y, SCENE.h);
  el.style.width = pct(w, SCENE.w);
  el.style.height = pct(h, SCENE.h);
}

function showToast(name) {
  toast.textContent = name.toUpperCase();
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

function open(name) {
  showToast("MEMBUKA " + name);
}

TILES.forEach((tile) => {
  const el = document.createElement("button");
  el.className = "hotspot";
  el.type = "button";
  el.dataset.label = tile.label;
  el.setAttribute("aria-label", tile.label);
  place(el, tile.x, tile.y, tile.w, tile.h);
  el.addEventListener("pointerdown", () => el.classList.add("is-pressed"));
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
    el.addEventListener(ev, () => el.classList.remove("is-pressed")));
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (tile.label === "Jurnal") { lapClick(); return; }
    open(tile.label);
  });
  stage.appendChild(el);
});


/* ---- laptop: terbuka (scene) -> menyala (glow) -> daftar aplikasi ---- */
const LAP = {x: 768, y: 294, w: 182, h: 154};
const lapG = document.getElementById("lap-glow");
place(lapG, LAP.x, LAP.y, LAP.w, LAP.h);

let lapState = 0;
let lapBusy = false;

function lapGlowFull() {
  const h = new Date().getHours();
  return (h >= 6 && h <= 17) ? "0.55" : "1";
}

function lapApply() {
  lapG.style.display = "block";
  lapG.style.opacity = lapState === 1 ? lapGlowFull() : "0";
}

function lapClick() {
  if (lapBusy) return;
  if (lapState === 0) {
    lapBusy = true;
    lapG.style.transition = "opacity .62s ease";
    lapG.style.opacity = lapGlowFull();
    setTimeout(() => {
      lapState = 1; lapBusy = false;
      lapG.style.transition = "";
      showToast("LAPTOP MENYALA");
    }, 640);
  } else {
    drawer.style.display = "block";
    showToast("DAFTAR APLIKASI");
  }
}

/* ---- daftar aplikasi ---- */
const drawer = document.getElementById("drawer");
const drawerGrid = document.getElementById("drawer-grid");
TILES.forEach((tile) => {
  const aktif = tile.label === "Cuaca" || tile.label === "File";
  const btn = document.createElement("button");

document.getElementById("drawer-back").addEventListener("click", () => {

});

lapApply();


const SKY_STOPS = [[0, "#0A0F2E", "#18224E"], [300, "#2E3A6E", "#F2955F"], [420, "#7FB2E8", "#CFE6F7"], [720, "#4D8FE0", "#A8CDF0"], [990, "#6D9BD8", "#F7C873"], [1080, "#3A3F7A", "#E86A5A"], [1170, "#232D5B", "#3A4C74"], [1440, "#1B2448", "#303F66"]];
const SKY = {x0:1108, x1:1185, y0:336, y1:372, amp:146};
let SKY_WEATHER = {langit:1, hujan:0, salju:false, kabut:false, petir:false, code:1};

function skyStored(){try{return localStorage.getItem("rk-sky-code");}catch(e){return null;}}
function skyStore(c){try{localStorage.setItem("rk-sky-code",String(c));}catch(e){}}
function skyHex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function skyMix(a,b,t){
  const A=skyHex2rgb(a),B=skyHex2rgb(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")";
}
function skyColors(m){
  m=((m%1440)+1440)%1440;
  for(let i=0;i<SKY_STOPS.length-1;i++){
    const a=SKY_STOPS[i],b=SKY_STOPS[i+1];
    if(m>=a[0]&&m<=b[0]){
      const t=(m-a[0])/Math.max(1,b[0]-a[0]);
      return [skyMix(a[1],b[1],t),skyMix(a[2],b[2],t)];
    }
  }
  return [SKY_STOPS[0][1],SKY_STOPS[0][2]];
}
function skyVisuals(code){
  if(code===0) return {langit:0,hujan:0};
  if(code===1) return {langit:1,hujan:0};
  if(code===2) return {langit:2,hujan:0};
  if(code===3) return {langit:3,hujan:0};
  if(code===45||code===48) return {langit:3,hujan:0,kabut:true};
  if(code>=51&&code<=57) return {langit:2,hujan:1};
  if(code===65||code===82) return {langit:2,hujan:3};
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return {langit:2,hujan:2};
  if((code>=71&&code<=77)||code===85||code===86) return {langit:2,hujan:0,salju:true};
  if(code===95||code===96||code===99) return {langit:3,hujan:3,petir:true};
  return {langit:2,hujan:0};
}
function setDisp(id,on){const el=document.getElementById(id);if(el)el.style.display=on?"":"none";}
function applySkyVis(isDay){
  const w=SKY_WEATHER;
  const clouds=document.getElementById("sky-clouds");
  if(clouds){
    const n=w.langit===0?0:(w.langit===1?1:(w.langit===2?3:5));
    [...clouds.children].forEach((c,i)=>c.style.display=i<n?"":"none");
    const cc=w.langit<=1?["#FFFFFF",0.92]:(w.langit===2?["#E8ECF2",0.9]:["#B9BFCB",0.85]);
    clouds.querySelectorAll(".sky-cloud-fill").forEach((el)=>{
      el.setAttribute("fill",cc[0]);el.setAttribute("fill-opacity",cc[1]);
    });
  }
  document.getElementById("sky-dim").setAttribute("opacity",
    ((w.langit===2?0.18:(w.langit===3?0.34:0))+(w.hujan>0?0.08:0)).toFixed(2));
  const rain=document.getElementById("sky-rain");
  setDisp("sky-rain",w.hujan>0);
  if(w.hujan>0){
    const max=w.hujan===1?46:(w.hujan===2?96:150);
    [...rain.children].forEach((l,i)=>l.style.display=i<max?"":"none");
  }
  setDisp("sky-snow",!!w.salju);
  setDisp("sky-fog",!!w.kabut);
  setDisp("sky-flash",!!w.petir);
  setDisp("sky-roomray",isDay&&w.langit===0);
  const rays=document.getElementById("sky-rays");
  if(rays) rays.setAttribute("opacity",w.langit===0?(w.code===0?0.85:0.6):0.25);
  setDisp("sky-stars",!isDay&&w.langit<=1);
}
let SKY_LAST_DAY=null;
function skyTick(){
  const now=new Date();
  const m=now.getHours()*60+now.getMinutes();
  const isDay=now.getHours()>=6&&now.getHours()<=17;
  const [ct,cb]=skyColors(m);
  document.getElementById("sg0").setAttribute("stop-color",ct);
  document.getElementById("sg1").setAttribute("stop-color",cb);
  let f;
  if(isDay) f=Math.min(1,Math.max(0,(m-360)/660));
  else f=(((m-1080+1440)%1440))/720;
  const ox=SKY.x0+(SKY.x1-SKY.x0)*f;
  const oy=(SKY.y0+(SKY.y1-SKY.y0)*f)-Math.sin(Math.PI*f)*SKY.amp;
  document.getElementById("sky-orb-pos").setAttribute("transform","translate("+ox.toFixed(1)+","+oy.toFixed(1)+")");
  setDisp("sky-sun",isDay&&SKY_WEATHER.langit<=2);
  // bulan selalu tampak di malam hari; mendung tebal hanya membuatnya samar
  setDisp("sky-moon",!isDay);
  const moonEl=document.getElementById("sky-moon");
  if(moonEl) moonEl.style.opacity=!isDay?(SKY_WEATHER.langit<=1?1:(SKY_WEATHER.langit===2?0.8:0.3)):"";
  if(isDay!==SKY_LAST_DAY){applySkyVis(isDay);SKY_LAST_DAY=isDay;}
}
function applySkyCode(code){
  if(typeof code!=="number")return;
  SKY_WEATHER=Object.assign({code:code},skyVisuals(code));
  document.getElementById("sky-anim").dataset.weather=String(code);
  applySkyVis(new Date().getHours()>=6&&new Date().getHours()<=17);
}
async function skyLoadWeather(){
  try{
    const opt={signal:(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)?AbortSignal.timeout(6000):undefined};
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-8.1728&longitude=113.6995&current=weather_code",opt);
    const j=await r.json();
    const c=j&&j.current&&j.current.weather_code;
    if(typeof c==="number"){skyStore(c);applySkyCode(c);}
  }catch(e){/* offline: pertahankan kode tersimpan */}
}
(function(){
  applySkyCode(parseInt(skyStored()||"1",10));
  skyTick();
  setInterval(skyTick,1000);
  skyLoadWeather();
  setInterval(skyLoadWeather,15*60*1000);
})();


function ambience(h) {
  if (h >= 5 && h <= 8) return "rgba(255,217,160,.10)";
  if (h >= 9 && h <= 15) return "rgba(58,70,112,.14)";  // siang lembut, meredam silau (0.16.10)
  if (h >= 16 && h <= 18) return "rgba(255,154,92,.12)";
  if (h >= 19 && h <= 22) return "rgba(43,63,143,.14)";
  return "rgba(6,10,34,.34)";
}

let lastDay = null;

function tick() {
  const now = new Date();
  const day = now.getHours() >= 6 && now.getHours() <= 17;

  if (day !== lastDay) {
    const file = day ? "scene_day.png" : "scene_night.png";
    sceneEl.src = file;
    const mode = day ? "day" : "night";
    document.querySelectorAll(".lap").forEach((img) => {
      img.src = img.dataset[mode];
    });
    document.querySelectorAll(".sway-scene").forEach((img) => img.setAttribute("href", file));
    lastDay = day;
  }

  tintEl.style.background = ambience(now.getHours());
}

tick();
setInterval(tick, 1000);

// pastikan stage selalu 1280:800 muat penuh di viewport apa pun
// (CSS min()/calc() gagal di sebagian webview — ukuran dihitung JS di sini)
function fit() {
  var st = document.getElementById("stage");
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  st.style.width = Math.floor(1280 * s) + "px";
  st.style.height = Math.floor(800 * s) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
fit();

// minta browser mengunci landscape saat layar disentuh
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } catch (_) {}
}
document.addEventListener("pointerdown", lockLandscape, { once: true });
</script>
